name: Build IPA
on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Fetch app icon
        id: icon
        run: |
          mkdir -p icon
          brew install imagemagick librsvg >/dev/null 2>&1 || true
          src=""
          bg="#F4EFE3"
          for url in \
            "https://img.icons8.com/fluency/1024/spades.png" \
            "https://img.icons8.com/color/1024/spades.png" \
            "https://img.icons8.com/fluency/1024/playing-cards.png" \
            "https://img.icons8.com/color/1024/playing-cards.png"; do
            if curl -fsSL -m 30 -A "Mozilla/5.0" -o icon/raw.png "$url" && magick identify icon/raw.png >/dev/null 2>&1; then
              src="Icons8 (icons8.com), $url"
              break
            fi
          done
          if [ -z "$src" ]; then
            curl -fsSL -m 30 -o icon/spade.svg "https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/suit-spade-fill.svg"
            sed -i '' 's/currentColor/white/g' icon/spade.svg
            rsvg-convert -w 1024 -h 1024 icon/spade.svg -o icon/raw.png
            src="Bootstrap Icons suit-spade-fill (MIT), getbootstrap.com"
            bg="#0B4D2E"
          fi
          magick -size 1024x1024 "xc:$bg" \( icon/raw.png -resize 640x640 \) -gravity center -composite -alpha off Sources/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          echo "source=$src" >> "$GITHUB_OUTPUT"
      - name: Fetch leather texture
        id: leather
        run: |
          mkdir -p tex
          dest=Sources/Assets.xcassets/Leather.imageset/leather.jpg
          src=""
          if curl -fsSL -m 60 -A "Mozilla/5.0" -o tex/raw.jpg "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/brown_leather/brown_leather_albedo_1k.jpg" && magick identify tex/raw.jpg >/dev/null 2>&1; then
            # Grayscale, compress contrast, then hard-light over Rosewater (#dc8a78) so the photo keeps its grain but takes the hue.
            magick tex/raw.jpg -colorspace Gray -normalize +level 22%,78% tex/gray.png
            magick -size 1024x1024 "xc:#dc8a78" tex/gray.png -compose HardLight -composite -modulate 82,105,100 -resize 512x512 -quality 88 "$dest"
            src="Leather texture: Brown Leather by Rob Tuytel, Poly Haven (CC0), tinted Rosewater"
          else
            magick -size 512x512 xc:gray50 +noise Random -colorspace Gray -blur 0x1 -normalize +level 30%,70% tex/gray.png
            magick -size 512x512 "xc:#dc8a78" tex/gray.png -compose HardLight -composite -modulate 82,105,100 -quality 88 "$dest"
            src="Leather texture: generated fallback (download failed)"
          fi
          echo "source=$src" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project Discard.xcodeproj -scheme Discard -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Discard.app Payload/
          zip -r "Discard-v${{ steps.ver.outputs.version }}.ipa" Payload
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "Discard-v${{ steps.ver.outputs.version }}.ipa" \
            --title "Discard v${{ steps.ver.outputs.version }}" \
            --notes "Unsigned IPA. Sign with Signulous and install with Feather. App icon: ${{ steps.icon.outputs.source }}. ${{ steps.leather.outputs.source }}." \
            --target "${{ github.sha }}"
