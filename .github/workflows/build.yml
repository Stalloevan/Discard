name: Build IPA
on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project Discard.xcodeproj -scheme Discard -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Discard.app Payload/
          zip -r "Discard-v${{ steps.ver.outputs.version }}.ipa" Payload
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "Discard-v${{ steps.ver.outputs.version }}.ipa" \
            --title "Discard v${{ steps.ver.outputs.version }}" \
            --notes "Unsigned IPA. Sign with Signulous and install with Feather." \
            --target "${{ github.sha }}"
